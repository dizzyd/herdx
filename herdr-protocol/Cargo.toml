[package]
name = "herdr-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "herdr's wire protocol, vendored from the pinned submodule"

[lib]
# herdr's vendored source carries its own `#[cfg(test)]` modules, which reach
# into subsystems this crate deliberately omits (the PTY-backed terminal
# runtime, tokio). Compiling them is not possible here, so validation lives in
# `tests/` instead, against herdr's own frozen protocol fixtures.
test = false

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.1", features = ["derive"] }
unicode-width = "0.2"
unicode-segmentation = "1.13.1"
toml = "0.8"
regex = "1"
libc = "0.2"
tracing = "0.1.44"
sha2 = "0.10"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
serde_ignored = "0.1.14"
time = { version = "0.3.47", features = ["formatting"] }
bytes = "1"

[dev-dependencies]
serde_json = "1"

# This crate compiles a *subset* of herdr's sources — only the modules a client
# needs — so a great deal of what they import and define is genuinely unused
# here. That produced well over a hundred warnings about code we deliberately
# do not reach, which drowned out the handful from the code we actually write.
#
# The files are symlinks into the pinned submodule, so they are not ours to
# edit; silencing has to happen at the crate. Only the categories a subset
# build creates are allowed, so a real problem in vendored code still shows up.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
private_interfaces = "allow"
deprecated = "allow"
