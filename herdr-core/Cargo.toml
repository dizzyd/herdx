[package]
name = "herdr-core"
version = "1.1.0"
edition.workspace = true
license.workspace = true
description = "Endpoint client and C ABI for HerdX, the native macOS herdr client"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
herdr-protocol = { path = "../herdr-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
